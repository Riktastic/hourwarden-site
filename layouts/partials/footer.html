<footer class="bottom">
  <div class="wrap row">
    <span>© {{ now.Year }} HourWarden · {{ i18n "madeIn" }}</span>
    <span class="links">
      {{ with site.GetPage "/privacy" }}<a href="{{ .RelPermalink }}">{{ i18n "privacyPolicy" }}</a>{{ end }}
      <a href="{{ site.Params.app }}/login">{{ i18n "signIn" }}</a>
      {{ with site.Params.contact }}<a href="mailto:{{ . }}">{{ . }}</a>{{ end }}
    </span>
  </div>
</footer>
