baseURL = "https://hourwarden.com/"
title = "HourWarden"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  # The hosted sync service.
  app = "https://app.hourwarden.com"
  # Download links; empty shows "coming soon". The release workflows of the
  # app repositories upload these files to the latest release of this repository.
  downloadWindows = "https://github.com/Riktastic/hourwarden-site/releases/latest/download/HourWarden-setup.exe"
  downloadAndroid = "https://github.com/Riktastic/hourwarden-site/releases/latest/download/HourWarden.apk"
  downloadDeb = "https://github.com/Riktastic/hourwarden-site/releases/latest/download/HourWarden-amd64.deb"
  downloadRpm = "https://github.com/Riktastic/hourwarden-site/releases/latest/download/HourWarden-x86_64.rpm"
  contact = ""

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
  [languages.nl]
    languageName = "Nederlands"
    weight = 2

[markup.goldmark.renderer]
  unsafe = false
